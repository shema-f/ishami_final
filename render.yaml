services:
  - type: web
    name: ishami-backend
    rootDir: server
    env: node
    buildCommand: npm install
    startCommand: node index.js
    autoDeploy: true
    healthCheckPath: /api/ai/status
    envVars:
      - key: MONGODB_URI
        value: mongodb+srv://admin:admin123@cluster0.3tglbwn.mongodb.net/?appName=Cluster0
      - key: MONGODB_DB
        value: ishami
      - key: JWT_SECRET
        value: ishami-production-jwt-secret-2024
      - key: FRONTEND_URL
        value: https://ishami.rw
      - key: PORT
        value: 5000
