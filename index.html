<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ISHAMI - Rwanda Traffic Rules | Amategeko y'Umuhanda</title>
    <meta name="description" content="Master Rwanda Traffic Rules with interactive quizzes, AI assistance, and 3D simulations." />
    <meta name="theme-color" content="#3D3D41" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="ISHAMI - Rwanda Traffic Rules Learning App" />
    <meta property="og:description" content="Master Rwanda Traffic Rules with interactive quizzes and AI assistance" />
    <meta property="og:image" content="https://ishami.rw/og-image.jpg" />
    <meta property="og:url" content="https://ishami.rw" />
    
    <!-- Fonts — display=swap prevents FOUT/CLS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700;800&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Critical inline styles to prevent CLS -->
    <style>
      html { background: #333337; }
      body { margin: 0; background: transparent; min-height: 100dvh; overscroll-behavior: none; }
      #root { min-height: 100dvh; }
      /* Prevent hero layout shift */
      .hero-placeholder { height: 100dvh; min-height: 600px; background: #0a0e14; }
      /* Mobile: prevent pull-to-refresh and overscroll only during simulation */
      body.sim-active { overflow: hidden; position: fixed; width: 100%; height: 100%; }
      /* Landscape simulation mode */
      @media (max-width: 768px) and (orientation: landscape) {
        body.sim-active { overscroll-behavior: none; touch-action: none; }
      }
    </style>
    
    <!-- PWA -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preload hero images used in the 3D scene -->
    <link rel="preload" href="/apple-touch-icon.png" as="image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PURGE STALE SERVICE WORKER (fixes cached index.html referencing dead chunk hashes) -->
    <script>
      if ('serviceWorker' in navigator) {
        (async function purgeServiceWorker() {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const reg of registrations) { await reg.unregister(); }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map(k => caches.delete(k)));
            }
          } catch (_) {}
        })();
      }
    </script>
  </body>
</html>
